<dom-module name="custom-item">
    <template>
        <style>

            .custom-item {
                position: relative;
                padding: 7px 15px 7px 50px;
                line-height: 21px;
                font-size: 12px;
                color: #8b8f97;
                border-bottom: 1px solid #e6ebed;
                display: table;
                table-layout: fixed;
                text-align: left;
            }

            .custom-item span {

                display: table-cell;
                width: 200px;

            }

            /*red lines*/
            .custom-item:before {
                content: '';
                width: 3px;
                z-index: 2;
                border: 1px solid #f2e3df;
                border-width: 0 1px;
                position: absolute;
                top: 0px;
                bottom: 0px;
                left: 35px;
            }

            /*checkbox box*/
            .custom-item .toggle:before, .custom-item .deactivated_toggle:before {
                content: '';
                width: 15px;
                height: 15px;
                background: #faf9f9;
                border: 1px solid #6bb3ca;
                border-radius: 2px;
                position: absolute;
                top: 9px;
                left: 9px;
                -webkit-box-shadow: 0 1px 1px #dfecf4;
                -moz-box-shadow: 0 1px 1px #dfecf4;
                box-shadow: 0 1px 1px #dfecf4;
            }

            input[type=checkbox] {
                display: none;
            }

            input[type=checkbox]:checked + .toggle:after, input[type=checkbox]:checked + .deactivated_toggle:after {
                opacity: 1;
            }

            .custom-item .toggle:hover:before, .custom-item .deactivated_toggle:hover:before {
                -webkit-box-shadow: 0 0 3px #6bb3ca;
                -moz-box-shadow: 0 0 3px #6bb3ca;
                box-shadow: 0 0 3px #6bb3ca;
            }

            .custom-item .toggle {
                display: block;
                height: 35px;
                width: 35px;
                position: absolute;
                top: 0px;
                bottom: 0px;
                left: 0px;
                text-indent: 100%;
                overflow: hidden;
                cursor: pointer;
            }

            .custom-item .deactivated_toggle {
                display: block;
                height: 35px;
                width: 35px;
                position: absolute;
                top: 0px;
                bottom: 0px;
                left: 0px;
                text-indent: 100%;
                overflow: hidden;
            }

            .custom-item .toggle:before, .custom-item .deactivated_toggle:before {
                content: '';
                width: 15px;
                height: 15px;
                background: #faf9f9;
                border: 1px solid #6bb3ca;
                border-radius: 2px;
                position: absolute;
                top: 9px;
                left: 9px;
                -webkit-box-shadow: 0 1px 1px #dfecf4;
                -moz-box-shadow: 0 1px 1px #dfecf4;
                box-shadow: 0 1px 1px #dfecf4;
            }

            .toggle:after, .deactivated_toggle:after {
                content: '';
                position: absolute;
                position: absolute;
                width: 7px;
                height: 3px;
                background: transparent;
                top: 14px;
                left: 13px;
                border: 2px solid #aaa;
                border-top: none;
                border-right: none;
                -webkit-transform: rotate(-45deg);
                -moz-transform: rotate(-45deg);
                -o-transform: rotate(-45deg);
                -ms-transform: rotate(-45deg);
                transform: rotate(-45deg);
                opacity: 0;
            }
        </style>

        <template is="dom-if" if="{{isHeader(apperance)}}">
            <div class="custom-item">
                <div style="display:none;">Done:</div>
                <span>ID:</span>
                <span>Text:</span>
                <span>created at:</span>
                <span>updated at:</span>
                <template is="dom-if" if="{{!isInlineEdit(inlineEdit)}}">
                    <span>view</span>
                    <span>edit</span>
                </template>
            </div>
        </template>

        <template is="dom-if" if="{{isIndex(apperance)}}">
            <div class="custom-item" id="item_{{object.id}}">
                <input id="done" type="checkbox" checked="{{object.done}}" disabled>
                <label class="deactivated_toggle" for="done"></label>
                <span id="id">{{object.id}}</span>
                <span id="text">{{object.text}}</span>
                <span id="created_at">{{object.created_at}}</span>
                <span id="updated_at">{{object.updated_at}}</span>
                <template is="dom-if" if="{{!isInlineEdit(inlineEdit)}}">
                    <span id="view"><button on-tap="view">view</button></span>
                    <span id="edit"><button on-tap="edit">edit</button></span>
                </template>
            </div>
        </template>

        <template is="dom-if" if="{{isView(apperance)}}">
            <div class="custom-item" id="item_{{object.id}}">
                <input id="done" type="checkbox" checked="{{object.done}}" disabled>
                <label class="deactivated_toggle" for="done"></label>
                <span id="id">ID: {{object.id}}</span>
                <span id="text">Text: {{object.text}}</span>
                <span id="created_at">created at: {{object.created_at}}</span>
                <span id="updated_at">updated at: {{object.updated_at}}</span>
                <template is="dom-if" if="{{!isInlineEdit(inlineEdit)}}">
                    <span id="view"><button on-tap="view">view</button></span>
                    <span id="edit"><button on-tap="edit">edit</button></span>
                    <template is="dom-if" if="{{isPagination(pagination)}}">
                        <span id="next"><button on-tap="next">next</button></span>
                        <span id="prev"><button on-tap="prev">prev</button></span>
                    </template>
                </template>
            </div>
        </template>

        <template is="dom-if" if="{{isEdit(apperance)}}">
            <div class="custom-item" id="item_{{object.id}}">
                <input id="done" type="checkbox" checked="{{object.done}}">
                <label class="toggle" for="done"></label>
                ID: <input id="id" type="text" value="{{object.id}}" disabled>
                Text: <input id="text" type="text" value="{{object.text}}">
                created at: <input type="text" value="{{object.created_at}}" disabled>
                updated at: <input type="text" value="{{object.updated_at}}" disabled>
                <button on-tap="save">save</button>
                <button on-tap="delete">delete</button>
            </div>

        </template>

        <template is="dom-if" if="{{isCreate(apperance)}}">
            <div class="custom-item" id="item_{{object.id}}">
                <input id="done" type="checkbox" checked="{{object.done}}">
                <label class="toggle" for="done"></label>
                Text: <input id="text" type="text" value="{{object.text}}">
                <button on-tap="save">save</button>
            </div>

        </template>
    </template>

</dom-module>
